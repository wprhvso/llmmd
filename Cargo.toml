[package]
name = "llmmd"
version = "0.1.6"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
comfy-table = "7.2"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py314"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
