[package]
name = "llmmd"
version = "0.1.7"
edition = "2024"
description = "Convert LLM-authored Markdown into Telegram message text and entities"
license = "MIT"
repository = "https://github.com/wprhvso/llmmd"
readme = "README.md"
# Distributed as a Python wheel built by maturin, never to crates.io.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
comfy-table = "7.2"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py314"] }
unicode-segmentation = "1.13"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
