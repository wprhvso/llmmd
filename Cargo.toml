[package]
name = "llmmd"
version = "0.1.7"
edition = "2024"
description = "Convert LLM-authored Markdown into Telegram message text and entities"
# Distributed as a Python wheel built by maturin, never to crates.io.
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
comfy-table = "7.2"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py314"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
