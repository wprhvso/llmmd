target-version = "py314"

line-length = 88

src = ["python"]

[lint]
select = ["ALL"]

ignore = [
    "D",
    "CPY001",
    # конфликтуют с ruff format
    "COM812",
    "ISC001",
    "E501",
    # process_markdown(markdown, with_photo) — булев параметр в опубликованном API pyo3
    "FBT001",
    "FBT002",
    "FBT003",
    # тексты и тесты на русском
    "RUF001",
    # потребовало бы блоков TYPE_CHECKING ради обёртки в 60 строк
    "TC001",
    "TC002",
    "TC003",
]

[lint.per-file-ignores]
"tests_python/**" = ["ANN", "INP001", "PLR2004", "PLR6301", "S101", "S311", "S603", "S607"]
"**/__main__.py" = ["T201"]
"**/cli.py" = ["T201"]

[lint.flake8-annotations]
suppress-dummy-args = true
allow-star-arg-any = true

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
