name: cd

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: wheels (${{ matrix.platform.target }}, ${{ matrix.platform.manylinux }})
    runs-on: nested
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: x86_64
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64
          - target: aarch64
            manylinux: "2_28"
            container: quay.io/pypa/manylinux_2_28_aarch64
          - target: aarch64
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
        if: matrix.platform.target == 'aarch64'
        with:
          platforms: arm64

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          container: ${{ matrix.platform.container }}
          docker-options: --platform ${{ matrix.platform.target == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          args: --release --strip --interpreter /opt/python/cp314-cp314/bin/python3.14 --out dist
          rust-toolchain: nightly
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: nested
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [wheels, sdist]
    runs-on: nested
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
