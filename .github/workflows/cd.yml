name: cd

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: pool
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy, test, doc]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: wprhvso/qa-rust@v1
        with:
          checks: ${{ matrix.check }}

  python:
    runs-on: pool
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, format, pyright, pytest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: wprhvso/qa-python@v1
        with:
          checks: ${{ matrix.check }}

  version:
    runs-on: pool
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: read
        run: |
          set -euo pipefail
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$declared" != "$crate" ]; then
            echo "pyproject $declared != Cargo.toml $crate" >&2
            exit 1
          fi
          curl -fsS https://pypi.org/pypi/llmmd/json -o pypi.json || echo '{}' > pypi.json
          release=$(uv run --no-project --with packaging python - "$declared" <<'PY'
          import json, sys
          from packaging.version import InvalidVersion, Version

          declared = Version(sys.argv[1])
          published = []
          for raw in json.load(open("pypi.json")).get("releases", {}):
              try:
                  published.append(Version(raw))
              except InvalidVersion:
                  pass
          highest = max(published, default=None)
          print("true" if highest is None or declared > highest else "false")
          print(f"{declared} vs pypi {highest}", file=sys.stderr)
          PY
          )
          echo "release=$release" >> "$GITHUB_OUTPUT"

  wheels:
    name: wheels (${{ matrix.platform.target }}, ${{ matrix.platform.libc }})
    needs: [rust, python, version]
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64
            libc: "2_28"
            container: quay.io/pypa/manylinux_2_28_x86_64
            docker_platform: linux/amd64
          - target: x86_64
            libc: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64
            docker_platform: linux/amd64
          - target: aarch64
            libc: "2_28"
            container: quay.io/pypa/manylinux_2_28_aarch64
            docker_platform: linux/arm64
          - target: aarch64
            libc: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64
            docker_platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform.target == 'aarch64'
        with:
          platforms: arm64
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.libc }}
          container: ${{ matrix.platform.container }}
          docker-options: --platform ${{ matrix.platform.docker_platform }}
          args: --release --strip --interpreter /opt/python/cp314-cp314/bin/python3.14 --out dist
          rust-toolchain: nightly
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.platform.libc }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: [rust, python, version]
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, wheels, sdist]
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
