name: cd

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: pool
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: read
        run: |
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          crate=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          test "$version" = "$crate"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  wheels:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64
            libc: "2_28"
            container: quay.io/pypa/manylinux_2_28_x86_64
            docker_platform: linux/amd64
          - target: x86_64
            libc: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64
            docker_platform: linux/amd64
          - target: aarch64
            libc: "2_28"
            container: quay.io/pypa/manylinux_2_28_aarch64
            docker_platform: linux/arm64
          - target: aarch64
            libc: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64
            docker_platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform.target == 'aarch64'
        with:
          platforms: arm64
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.libc }}
          container: ${{ matrix.platform.container }}
          docker-options: --platform ${{ matrix.platform.docker_platform }}
          args: --release --strip --interpreter /opt/python/cp314-cp314/bin/python3.14 --out dist
          rust-toolchain: nightly
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}-${{ matrix.platform.libc }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - run: uv run --no-project --with 'maturin>=1.14.1' maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, wheels, sdist]
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
