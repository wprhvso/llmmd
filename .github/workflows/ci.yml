name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # Rust-часть: настройки (rustfmt.toml, clippy.toml, набор линтов) живут в
  # wprhvso/qa-rust. Канал toolchain экшен берёт из rust-toolchain.toml.
  rust:
    runs-on: pool
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy, test, doc]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: wprhvso/qa-rust@v1
        with:
          checks: ${{ matrix.check }}

  # Python-часть: настройки (ruff.toml, pyrightconfig.json, pytest.ini) живут в
  # wprhvso/qa-python.
  python:
    runs-on: pool
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, format, pyright, pytest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Пакет собирается maturin'ом, поэтому uv sync внутри экшена требует
      # компилятора Rust.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: wprhvso/qa-python@v1
        with:
          checks: ${{ matrix.check }}
