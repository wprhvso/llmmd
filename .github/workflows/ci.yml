name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check

  clippy:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked --all-features

  ruff:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - run: ruff check --output-format github .

  format:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - run: ruff format --check --diff .

  pyright:
    runs-on: pool
    env:
      MATURIN_PEP517_ARGS: --profile release
    steps:
      - uses: actions/checkout@v7
      - run: uv sync --frozen
      - run: basedpyright

  pytest:
    runs-on: pool
    env:
      MATURIN_PEP517_ARGS: --profile release
    steps:
      - uses: actions/checkout@v7
      - run: uv sync --frozen
      - run: echo "$PWD/.venv/bin" >>"$GITHUB_PATH"
      - run: pytest

  package:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - run: uv run --no-project --with 'maturin>=1.14.1' maturin sdist --out dist
      - run: uv run --no-project --with 'maturin>=1.14.1' maturin build --out dist
      - run: |
          uv venv --python 3.14 smoke-env
          uv pip install --python smoke-env/bin/python dist/*.whl
          smoke-env/bin/python - <<'PY'
          import importlib.metadata as md

          import llmmd

          (chunk,) = llmmd.process_markdown("# T\n\n**bold** and `code`\n")
          assert chunk["text"] == "# T\n\nbold and code\n", chunk
          kinds = {e["type"] for e in chunk["entities"]}
          assert kinds == {"bold", "code"}, chunk
          assert (llmmd.MESSAGE_LIMIT, llmmd.CAPTION_LIMIT) == (4096, 1024)

          meta = md.metadata("llmmd")
          assert meta["Summary"], "the package ships without a summary"
          assert meta["License-Expression"] == "MIT", meta["License-Expression"]
          assert meta["Description"], "the package ships without a readme"
          PY
          smoke-env/bin/llmmd --help >/dev/null
          unzip -l dist/*.whl | grep -q "llmmd/py.typed"
